<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distal Femur Fractures · OrthoRef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --teal:#1a7a6e; --paper:#f8f5f0; --ink:#1a1814;
  --muted:#5c5850; --rule:#d4cec6; --highlight:#fff7e6; --warn:#8b4513; --surface:#f0ece4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.6;-webkit-font-smoothing:antialiased}
.label{font-family:"DM Mono",monospace;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted)}
h1,h2,h3,h4{font-family:"Playfair Display",Georgia,serif;line-height:1.15;font-weight:700}
b,strong{font-weight:700}

/* header */
header{background:var(--ink);color:var(--paper);padding:2.4rem 1.5rem 2rem}
.hwrap{max-width:1000px;margin:0 auto}
header .crumb{font-family:"DM Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#b8a99a}
header h1{font-size:2.5rem;font-weight:800;margin:.5rem 0 .4rem;color:#fff}
header .sub{color:#d8cec2;font-size:1.05rem;max-width:60ch}
header .src{margin-top:1rem;font-family:"DM Mono",monospace;font-size:.7rem;color:#9a8b7c;border-top:1px solid #3a352f;padding-top:.8rem}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tabinner{max-width:1000px;margin:0 auto;display:flex;gap:.2rem;overflow-x:auto;padding:0 .8rem}
.tabinner button{flex:0 0 auto;background:none;border:none;cursor:pointer;font-family:"DM Mono",monospace;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:1rem .95rem;border-bottom:3px solid transparent;transition:color .15s}
.tabinner button:hover{color:var(--ink)}
.tabinner button.active{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1000px;margin:0 auto;padding:2.2rem 1.5rem 5rem}
.panel{display:none}
.panel.active{display:block}
section{margin-bottom:2.6rem}
.eyebrow{color:var(--accent);font-family:"DM Mono",monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem}
h2.sec{font-size:1.7rem;margin-bottom:.3rem}
h3.sub{font-size:1.2rem;margin:1.6rem 0 .7rem;color:var(--ink)}
p{margin-bottom:.8rem}
.lead{font-size:1.12rem;color:#332f29}

/* lists */
ul.clean{list-style:none}
ul.clean li{position:relative;padding-left:1.3rem;margin-bottom:.5rem}
ul.clean li::before{content:"";position:absolute;left:0;top:.65em;width:6px;height:6px;background:var(--teal);border-radius:50%}
.hot{font-weight:700;color:var(--accent)}

/* epidemiology infographic */
.epigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin:1rem 0}
.epicard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:1rem}
.epicard .num{font-family:"Playfair Display";font-weight:800;font-size:1.6rem;color:var(--accent);line-height:1}
.epicard .cap{font-size:.92rem;color:var(--muted);margin-top:.4rem}

/* generic callout cards */
.card{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:.8rem}
.card .k{font-family:"Playfair Display";font-weight:700;font-size:1.02rem;margin-bottom:.2rem}
.deform{display:grid;grid-template-columns:1fr;gap:.6rem;margin:.8rem 0}
.drow{display:grid;grid-template-columns:minmax(140px,.9fr) 1.4fr;gap:.8rem;background:var(--surface);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:.7rem .9rem}
.drow .a{font-weight:700}
@media(max-width:560px){.drow{grid-template-columns:1fr;gap:.2rem}}

.goalbox{background:var(--highlight);border:1px solid #ecd9a8;border-radius:10px;padding:1.1rem 1.3rem;margin-top:1rem}
.goalbox .label{color:var(--warn)}
.goalbox ol{margin:.5rem 0 0 1.1rem}
.goalbox li{margin-bottom:.3rem;font-weight:600}

/* figures */
figure{margin:1.2rem 0;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:.7rem;text-align:center}
figure img{max-width:100%;height:auto;border-radius:6px;cursor:zoom-in}
figcaption{font-size:.86rem;color:var(--muted);margin-top:.6rem;text-align:left;line-height:1.45}
figcaption .tag{font-family:"DM Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);display:block;margin-top:.3rem}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}

/* Classification explorer */
.cx-pills{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 1.3rem}
.cx-pill{cursor:pointer;border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:.55rem 1.1rem;font-family:"DM Mono",monospace;font-size:.82rem;letter-spacing:.03em;color:var(--ink);transition:all .15s}
.cx-pill:hover{border-color:var(--teal)}
.cx-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cx-body{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.3rem}
.cx-body .blurb{font-size:1.05rem;color:#332f29;margin-bottom:1rem}
.cx-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.chip{background:#fff;border:1px solid var(--rule);border-radius:9px;padding:.9rem;border-top:3px solid var(--teal)}
.chip .code{font-family:"DM Mono",monospace;font-weight:500;font-size:.8rem;color:var(--accent);letter-spacing:.05em}
.chip .nm{font-family:"Playfair Display";font-weight:700;font-size:1rem;margin:.15rem 0 .35rem}
.chip .ds{font-size:.9rem;color:var(--muted);line-height:1.45}

/* Step Walkthrough */
.wt-select{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.1rem}
.wt-select button{cursor:pointer;border:1.5px solid var(--rule);background:#fff;border-radius:8px;padding:.5rem .85rem;font-family:"DM Mono",monospace;font-size:.75rem;color:var(--ink);text-align:left;transition:all .15s}
.wt-select button:hover{border-color:var(--teal)}
.wt-select button.active{background:var(--ink);border-color:var(--ink);color:#fff}
.wt-stage{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.wt-imgwrap{background:var(--surface);text-align:center;padding:1rem;border-bottom:1px solid var(--rule)}
.wt-imgwrap img{max-width:100%;max-height:360px;height:auto;border-radius:6px;cursor:zoom-in}
.wt-content{padding:1.2rem 1.3rem}
.wt-step-label{font-family:"DM Mono",monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.wt-content h4{font-size:1.25rem;margin:.3rem 0 .55rem}
.wt-content p.body{margin-bottom:.7rem}
.callout{border-radius:8px;padding:.65rem .85rem;margin-top:.6rem;font-size:.95rem}
.callout.pearl{background:#eef6f4;border-left:3px solid var(--teal)}
.callout.hazard{background:#fbeee9;border-left:3px solid var(--accent)}
.callout .cl{font-family:"DM Mono",monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:500;display:block;margin-bottom:.2rem}
.callout.pearl .cl{color:var(--teal)}
.callout.hazard .cl{color:var(--accent)}
.wt-nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.3rem;border-top:1px solid var(--rule);background:var(--surface)}
.wt-nav button{cursor:pointer;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:.5rem .9rem;font-family:"DM Mono",monospace;font-size:.75rem;letter-spacing:.03em}
.wt-nav button:disabled{opacity:.3;cursor:default}
.wt-dots{display:flex;gap:.4rem}
.wt-dot{width:9px;height:9px;border-radius:50%;background:var(--rule);cursor:pointer;transition:background .15s}
.wt-dot.active{background:var(--accent)}

/* implant cards */
.impl{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:.9rem}
.impl .k{font-family:"Playfair Display";font-weight:700;font-size:1.08rem;color:var(--ink);margin-bottom:.5rem;border-bottom:1px solid var(--rule);padding-bottom:.4rem}

/* two-col indication grid */
.indgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
@media(max-width:640px){.indgrid{grid-template-columns:1fr}}
.indbox{border-radius:10px;padding:1rem 1.1rem}
.indbox.go{background:#eef6f4;border:1px solid #bfe0d9}
.indbox.no{background:#fbeee9;border:1px solid #e7c6bb}
.indbox .h{font-family:"DM Mono",monospace;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}
.indbox.go .h{color:var(--teal)}
.indbox.no .h{color:var(--accent)}

/* complications accordion */
.acc{border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:.7rem;background:#fff}
.acc-head{cursor:pointer;padding:.95rem 1.1rem;display:flex;justify-content:space-between;align-items:center;font-family:"Playfair Display";font-weight:700;font-size:1.05rem}
.acc-head:hover{background:var(--surface)}
.acc-head .tw{font-family:"DM Mono";color:var(--accent);font-size:1.1rem;transition:transform .2s}
.acc.open .acc-head .tw{transform:rotate(45deg)}
.acc-body{display:none;padding:0 1.1rem 1.1rem}
.acc.open .acc-body{display:block}

/* key points */
.kp{background:var(--ink);color:var(--paper);border-radius:12px;padding:1.4rem 1.5rem}
.kp .label{color:#b8a99a}
.kp h3{color:#fff;font-size:1.3rem;margin:.3rem 0 .8rem}
.kp ul{list-style:none}
.kp li{position:relative;padding-left:1.5rem;margin-bottom:.55rem;color:#e8dfd4}
.kp li::before{content:"\2192";position:absolute;left:0;color:var(--accent);font-weight:700}

/* lightbox */
#lb{display:none;position:fixed;inset:0;background:rgba(20,18,16,.92);z-index:100;cursor:zoom-out;align-items:center;justify-content:center;padding:2rem}
#lb.on{display:flex}
#lb img{max-width:95%;max-height:92%;border-radius:6px}
#lb .x{position:absolute;top:1.2rem;right:1.6rem;color:#fff;font-family:"DM Mono";font-size:1.6rem}

footer{max-width:1000px;margin:0 auto;padding:1.5rem;border-top:1px solid var(--rule);font-family:"DM Mono";font-size:.7rem;color:var(--muted);text-align:center;line-height:1.6}
</style>
</head>

const DATA = {"title": "Distal Femur Fractures", "subtitle": "Supracondylar & intercondylar fractures of the distal femur", "source": "Rockwood & Green's Fractures in Adults, 10e — Ch. 58 (Collinge & Roward) · AO Foundation Surgery Reference", "overview": {"epi": [["Up to 6%", "of all femur fractures; ~0.4% of all fractures"], ["Bimodal", "high-energy in young patients; low-energy falls in elderly osteoporotic patients"], ["5–10%", "are open injuries — wound usually anterior, proximal to patella, threatening the extensor mechanism"], ["Up to 50%", "of high-energy patterns show proximal extension into the femoral diaphysis"], ["~40%", "coronal-plane (Hoffa) fractures accompany intercondylar fractures — frequently missed on plain films"]], "mechanism": ["Axial loading combined with varus, valgus or rotational force.", "Young: high-energy MVC / motorcycle trauma → displacement, comminution, open wounds.", "Elderly: ground-level fall onto a flexed knee.", "Anterior femoral notching during TKA chamfer cuts predisposes to periprosthetic fracture."], "deforming": [["Quadriceps + hamstrings + adductors", "shortening with varus angulation at the fracture"], ["Gastrocnemius", "apex-posterior angulation — distal fragment tips into extension"], ["Condylar soft-tissue attachments", "splaying & rotational malalignment of condyles in intra-articular patterns"]], "assoc": ["Ipsilateral hip / femoral shaft, tibia, ankle and foot injuries are common in high-energy trauma.", "Vascular injury is uncommon (bundle tethered at adductor hiatus & soleus arch) but potentially limb-threatening — a complete vascular exam is obligatory.", "ACL is the most commonly injured ligament; midsubstance tears are treated non-operatively initially.", "Elderly low-energy distal femur fractures carry mortality approaching that of hip fractures (>50% at ~5 yr in some series)."], "imaging": ["AP + lateral of knee and full femur; include pelvis, ipsilateral hip & shaft.", "Traction radiographs clarify geometry when shortened/deformed.", "CT with reconstructions is an important adjunct — delineates articular injury and detects occult Hoffa fractures (~40% of intercondylar fractures).", "Ankle–ankle index: <10% side-to-side difference makes vascular injury unlikely; CT/conventional angiography for absent pulse, expanding haematoma, or persistent bleeding."], "goals": ["Anatomic reduction of the articular surface", "Restoration of limb length, axis & rotation", "Stable fixation permitting early knee motion", "Preservation of the biologic (soft-tissue) environment"]}, "anatomy": {"figs": ["rg_584", "rg_585", "rg_xsec"], "bone": [["Supracondylar zone", "distal ~15 cm of femur, between the condyles and the metaphyseal–diaphyseal junction."], ["Trapezoidal condyles", "wider posteriorly than anteriorly — ~25° inclination medially, ~15° laterally. Lateral-to-medial screws that look correct on AP may be too long and irritate medial tissues."], ["Lateral condyle", "broader, extends farther proximally; provides most of the patellar contact surface. Lateral epicondyle → fibular collateral ligament; popliteus groove lies just below."], ["Medial condyle", "longer, extends farther distally; medial epicondyle → tibial collateral ligament. Adductor tubercle (adductor magnus insertion) sits proximally."]], "axis": ["Knee joint line is normally parallel to the ground/ankle.", "Anatomic axis of the femoral shaft sits in ~6–7° valgus to the joint line (range 2–10°).", "Lateral distal femoral angle ≈ 80–84° medial / 96–100° lateral reference.", "The uninjured contralateral limb is the best intra-operative template for length, axis & rotation."], "soft": [["Quadriceps (femoral n.)", "anterior extensor power; becomes the quadriceps then patellar tendon to the tibial tubercle."], ["Hamstrings (sciatic n.)", "flex the knee; semi-membranosus/tendinosus medial, biceps femoris lateral."], ["Gastrocnemius", "origins in the supracondylar region — the deforming force pulling the distal fragment posteri ver VMO longitudinally; proximally the sartorius–rectus interval exposes vastus medialis, retracted anteriorly to reach the medial shaft.", "pearl": null, "hazard": null}, {"img": "ao_med_1", "title": "Protect the neurovascular structures", "body": "The femoral vessels pierce adductor magnus ~10–12 cm above the joint and cross the mid-sagittal axis ~18.8 cm proximal to the adductor tubercle. The saphenous nerve runs with the descending genicular vessels.", "pearl": "Intra-operative Doppler can map the vessels before proximal extension.", "hazard": "Uncontrolled proximal dissection risks the femoral artery at the adductor hiatus — keep the sartorius fascia/VM floor as protection."}, {"img": "ao_med_2", "title": "Descending genicular vessels", "body": "The descending genicular artery and its branches to VMO are encountered near the adductor magnus tendon; control as needed.", "pearl": null, "hazard": null}, {"img": "rg_5816", "title": "VMO-sparing arthrotomy & fixation", "body": "Elevate VMO proximally; L-shaped distal tenotomy with a medial parapatellar limb (leave a cuff to repair). Medial arthrotomy gives excellent access to (mostly medial) articular comminution for reduction and fixation.", "pearl": "Minimise stripping when the medial exposure only supplements lateral fixation — reduce healing/infection risk.", "hazard": "Protect the MCL and medial meniscus during the arthrotomy."}]}, {"name": "Retrograde intramedullary nailing (A & C)", "steps": [{"img": "rg_581", "title": "Position & overcome deforming forces", "body": "Supine on a radiolucent flat-top table; knee flexed 20–30° over a radiolucent triangle/bump. Full paralysis. Restore length with a femoral distractor + towel roll before nailing.", "pearl": "The towel-roll position controls the sagittal (apex-posterior) deformity from gastrocnemius pull.", "hazard": null}, {"img": "rg_5814", "title": "Arthrotomy for articular splits", "body": "Extra-articular (A): 4–5 cm medial/lateral parapatellar incision between inferior patella and tibial tubercle. Displaced C1–C3: open medial/lateral parapatellar arthrotomy to reduce & lag the condyles FIRST.", "pearl": null, "hazard": "Protect the patella and cartilage from reamers — use a soft-tissue cannula or right-angle retractors."}, {"img": "rg_584", "title": "Establish the start point", "body": "Entry at the apex of the intercondylar notch, just anterior to the PCL femoral attachment; on the lateral view just anterior to Blumensaat's line. Confirm on AP + lateral before reaming.", "pearl": "Start point and initial reamer trajectory determine coronal alignment — the single biggest lever on malalignment.", "hazard": "A too-anterior/eccentric start reams the patellofemoral joint or imparts deformity from nail–canal mismatch."}, {"img": "rg_5810", "title": "Lock the condylar block", "body": "Advance a full-length nail; place multiplanar distal interlocks. Use a locking attachment plate / supplemental screws for the short osteoporotic condylar segment.", "pearl": "In ipsilateral hip + distal femur fractures, fix the hip with screws and the shaft with a retrograde nail independently.", "hazard": "Leaving the nail proud injures the patellofemoral joint — recess it beneath the notch cartilage."}]}]}, "complications": [{"name": "Malalignment / malunion", "pts": ["Malalignment >5–10° alters knee mechanics & gait; varus/valgus overloads a compartment → arthrosis.", "Varus collapse was the classic failure of non-locking condylar buttress plates.", "Implant misapplication ('rule of too's': too distal / too anterior-posterior / too rotated) and nail start-point/geometry are the main causes — demand high intra-operative scrutiny."]}, {"name": "Nonunion", "pts": ["Historic open ORIF: delayed/nonunion 29–38%; biologic technique + fixed-angle/locked implants → union 93–100%.", "Modern lateral locked plating still reports nonunion up to ~20% in some series; systematic review ~4.7% overall and ~1 in 8 fractures needs reoperation (nonunion the comm const IMG = Object.fromEntries(IMAGES.map(o=>[o.id,o]));

function fig(id, extraClass){
  const o = IMG[id]; if(!o) return '';
  return `<figure class="${extraClass||''}"><img src="${o.data}" alt="${o.caption.replace(/"/g,'&quot;')}" data-full="${o.data}"><figcaption>${o.caption}<span class="tag">${o.source}</span></figcaption></figure>`;
}

/* ---------- header ---------- */
document.getElementById('h-title').textContent = DATA.title;
document.getElementById('h-sub').textContent = DATA.subtitle;
document.getElementById('h-src').textContent = DATA.source;

/* ---------- panel builders ---------- */
function pOverview(){
  const o=DATA.overview;
  return `<section>
    <div class="eyebrow">Assessment</div><h2 class="sec">Overview &amp; Epidemiology</h2>
    <p class="lead">Once managed in traction, distal femur fractures are now almost always fixed internally. They span a wide spectrum &mdash; from simple low-energy metaphyseal breaks in osteoporotic bone to comminuted intra-articular injuries in high-energy trauma.</p>
    <div class="epigrid">${o.epi.map(e=>`<div class="epicard"><div class="num">${e[0]}</div><div class="cap">${e[1]}</div></div>`).join('')}</div>
  </section>
  <section><h3 class="sub">Mechanism of injury</h3>
    <ul class="clean">${o.mechanism.map(m=>`<li>${m}</li>`).join('')}</ul>
    ${fig('rg_581')}
    <h3 class="sub">Deforming forces</h3>
    <div class="deform">${o.deforming.map(d=>`<div class="drow"><div class="a">${d[0]}</div><div>${d[1]}</div></div>`).join('')}</div>
  </section>
  <section><h3 class="sub">Associated injuries</h3>
    <ul class="clean">${o.assoc.map(a=>`<li>${a}</li>`).join('')}</ul>
    <h3 class="sub">Imaging</h3>
    <ul class="clean">${o.imaging.map(a=>`<li>${a}</li>`).join('')}</ul>
    <div class="goalbox"><span class="label">Goals of treatment</span><ol>${o.goals.map(g=>`<li>${g}</li>`).join('')}</ol></div>
  </section>`;
}

  const a=DATA.anatomy;
  return `<section>
    <div class="eyebrow">Applied Anatomy</div><h2 class="sec">Pathoanatomy of the Distal Femur</h2>

    <h3 class="sub">Bone</h3>
    ${a.bone.map(b=>`<div class="card"><div class="k">${b[0]}</div>${b[1]}</div>`).join('')}

    <ul class="clean">${a.axis.map(x=>`<li>${x}</li>`).join('')}</ul>

}

  const t=DATA.classification.types[i];

    `<div class="blurb">${t.blurb}</div><div class="cx-chips">${t.subs.map(s=>`<div class="chip"><div class="code">${t.key}.${s[0].slice(-1)} &middot; ${s[0]}</div><div class="nm">${s[1]}</div><div class="ds">${s[2]}</div></div>`).join('')}</div>`;
}

    <div class="eyebrow">Treatment</div><h2 class="sec">Management Options</h2>
    <h3 class="sub">Non-operative treatment</h3>

function pApproach(){
  const a=DATA.approaches;
  return `<section>
    <div class="eyebrow">Surgical Approaches</div><h2 class="sec">Approach Walkthroughs</h2>
    <p class="lead">${a.intro}</p>
    <div class="wt-select" id="wtsel">${a.walkthroughs.map((w,i)=>`<button data-w="${i}" class="${i===0?'active':''}">${w.name}</button>`).join('')}</div>
    <div id="wtstage"></div>
  </section>`;
}
let wtW=0, wtS=0;
function renderWt(){
  const w=DATA.approaches.walkthroughs[wtW];
  const s=w.steps[wtS];
  document.querySelectorAll('#wtsel button').forEach(b=>b.classList.toggle('active',+b.dataset.w===wtW));
  const o=IMG[s.img];
  document.getElementById('wtstage').innerHTML=`
   <div class="wt-stage">
    <div class="wt-imgwrap">${o?`<img src="${o.data}" data-full="${o.data}" alt="${s.title}">`:''}</div>
    <div class="wt-content">
      <span class="wt-step-label">Step ${wtS+1} / ${w.steps.length}</span>
      <h4>${s.title}</h4>
      <p class="body">${s.body}</p>
      ${s.pearl?`<div class="callout pearl"><span class="cl">Pearl</span>${s.pearl}</div>`:''}
      ${s.hazard?`<div class="callout hazard"><span class="cl">Hazard</span>${s.hazard}</div>`:''}
      ${o?`<div style="font-family:'DM Mono';font-size:.64rem;color:var(--muted);margin-top:.7rem;text-transform:uppercase;letter-spacing:.05em">${o.source}</div>`:''}
    </div>
    <div class="wt-nav">
      <button id="wtprev" ${wtS===0?'disabled':''}>&larr; Prev</button>
      <div class="wt-dots">${w.steps.map((_,i)=>`<span class="wt-dot ${i===wtS?'active':''}" data-s="${i}"></span>`).join('')}</div>
      <button id="wtnext" ${wtS===w.steps.length-1?'disabled':''}>Next &rarr;</button>
    </div>
   </div>`;
  document.getElementById('wtprev').onclick=()=>{if(wtS>0){wtS--;renderWt();}};
  document.getElementById('wtnext').onclick=()=>{if(wtS<w.steps.length-1){wtS++;renderWt();}};
  document.querySelectorAll('#wtstage .wt-dot').forEach(d=>d.onclick=()=>{wtS=+d.dataset.s;renderWt();});
}

function pComp(){
  const c=DATA.complications;
  return `<section>
    <div class="eyebrow">Adverse Outcomes</div><h2 class="sec">Complications</h2>
    ${c.map((x,i)=>`<div class="acc${i===0?' open':''}"><div class="acc-head" data-a="${i}">${x.name}<span class="tw">+</span></div><div class="acc-body"><ul class="clean">${x.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div></div>`).join('')}
  </section>
  <section><div class="kp"><span class="label">Exam recall</span><h3>Key points</h3><ul>${DATA.keypoints.map(k=>`<li>${k}</li>`).join('')}</ul></div></section>`;
}

];
const tabbar=document.getElementById('tabbar');
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[0];b.dataset.i=i;if(i===0)b.classList.add('active');tabbar.appendChild(b);});
const main=document.getElementById('main');
function show(i){
  TABS.forEach((t,j)=>{});
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));
  main.innerHTML=`<div class="panel active">${TABS[i][1]()}</div>`;
  window.scrollTo({top:0,behavior:'instant'});
  if(i===2) renderCx(0);
  if(i===4){wtW=0;wtS=0;renderWt();}
  bindDynamic();
}
function bindDynamic(){
  document.querySelectorAll('#cxpills .cx-pill').forEach(p=>p.onclick=()=>renderCx(+p.dataset.i));
  document.querySelectorAll('#wtsel button').forEach(b=>b.onclick=()=>{wtW=+b.dataset.w;wtS=0;renderWt();});
  document.querySelectorAll('.acc-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>show(+b.dataset.i));

/* lightbox (event delegation) */
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.tagName==='IMG'&&t.dataset.full){lbimg.src=t.dataset.full;lb.classList.add('on');}
  else if(t.id==='lb'||t.classList.contains('x')){lb.classList.remove('on');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});

show(0);
</script>
</body>
